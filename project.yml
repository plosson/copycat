name: Copycat
options:
  bundleIdPrefix: com.plosson
  deploymentTarget:
    macOS: "14.0"
packages:
  CopycatCore:
    path: CopycatCore
  HoulahopUpdater:
    path: scripts/mac-release
targets:
  Copycat:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: CopycatCore
      - package: HoulahopUpdater
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Copycat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        # Sparkle: the release script uploads appcast.xml to each GitHub release, so "latest" always points to the newest one.
        SUFeedURL: https://github.com/plosson/copycat/releases/latest/download/appcast.xml
        SUPublicEDKey: jTyx8CP85LrSQRllNXirGNf1OFEA5vO/bDBMJrD9nSs=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plosson.copycat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: 5.0
      configs:
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
